<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paiement réussi - Shizu Bot Premium" />
    <title>Paiement réussi - Shizu Bot</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #050716 0%, #0a1030 100%);
        color: #eff8ff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        max-width: 600px;
        padding: 40px;
        background: rgba(10, 16, 48, 0.9);
        border-radius: 12px;
        border: 1px solid rgba(101, 239, 255, 0.3);
        box-shadow: 0 0 50px rgba(101, 239, 255, 0.2);
      }
      h1 {
        color: #ffe28a;
        margin-bottom: 20px;
      }
      .success-icon {
        font-size: 4rem;
        color: #7fffd0;
        margin-bottom: 20px;
      }
      p {
        margin: 15px 0;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #65efff 0%, #9b67ff 100%);
        color: #03111c;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        margin-top: 20px;
        transition: transform 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="success-icon">✅</div>
      <h1>Paiement réussi !</h1>
      <p>Merci pour votre achat ! Votre statut Premium a été activé.</p>
      <p>Le bot devrait automatiquement vous attribuer le rôle Premium sur le serveur Discord.</p>
      <p>Si vous ne voyez pas le rôle immédiatement, essayez de vous reconnecter au serveur.</p>
      <a href="/shizu-bot/" class="btn">Retour au site</a>
    </div>
  </body>
</html>
